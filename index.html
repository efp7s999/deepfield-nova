<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deepfield NOVA</title>
<!--
  Deepfield NOVA: your servers, agents or notes drawn as a living patch of sky.
  One file. No build step, no libraries, no network requests except the one data file named in CONFIG below.
  Data contract: SCHEMA.md.  Connecting your own systems: AGENTS.md.  Licence: MIT.
-->
<style>
:root{
  --ink:#e9edff; --dim:#9aa3cf; --faint:#666e98;
  --glass:rgba(9,12,30,.56); --edge:rgba(150,175,255,.22);
  --ok:#7fe3c3; --warn:#ffc266; --bad:#ff6b7a; --off:#7b819f; --unk:#b9a6ff; --acc:#7ef0ff;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#02030a;color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.pt{cursor:pointer}
#c:active{cursor:grabbing}

/* panels: dark glass over the sky. The blur is dropped if the GPU is struggling (body.lite) */
.panel{position:fixed;background:var(--glass);border:1px solid var(--edge);border-radius:12px;backdrop-filter:blur(9px) saturate(1.25);-webkit-backdrop-filter:blur(9px) saturate(1.25)}
.lite .panel,.lite #alert{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(9,12,30,.82)}
h1,h2,h3,p{margin:0}

#brand{top:16px;left:20px;padding:10px 16px 9px;pointer-events:none}
#brand h1{font-size:20px;font-weight:650;letter-spacing:.01em}
#brand p{color:var(--dim)}
#clock{font:500 13px var(--mono);color:var(--ink);margin-right:8px}

#alert{position:fixed;top:14px;left:50%;transform:translateX(-50%);max-width:min(46vw,640px);padding:8px 16px 8px 12px;border-radius:999px;
  display:flex;gap:10px;align-items:center;background:rgba(88,10,26,.6);border:1px solid rgba(255,107,122,.75);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  box-shadow:0 0 26px rgba(255,60,90,.28);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#alert.on{opacity:1;visibility:visible}
#alert.warn{background:rgba(84,52,6,.6);border-color:rgba(255,194,102,.75);box-shadow:0 0 26px rgba(255,180,60,.22)}
#alert.info{background:rgba(12,20,46,.62);border-color:var(--edge);box-shadow:none}
#alert.info i{background:var(--acc);box-shadow:0 0 8px var(--acc);animation:none}
#alert i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad);animation:beat 1.1s ease-in-out infinite}
#alert.warn i{background:var(--warn);box-shadow:0 0 10px var(--warn)}
#alert b{font-weight:650;white-space:nowrap}
#alert span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#alert em{font:normal 12px var(--mono);color:var(--dim);white-space:nowrap}
@keyframes beat{50%{opacity:.35;transform:scale(.8)}}

#fleet{top:16px;right:20px;width:252px;padding:14px 16px 12px}
#read{top:100px;left:20px;width:292px;max-height:calc(100vh - 190px);overflow:auto;padding:14px 16px;opacity:0;visibility:hidden;transform:translateX(-8px);transition:opacity .18s,transform .18s,visibility .18s;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
#read.on{opacity:1;visibility:visible;transform:none}
.panel h2{font-size:15px;font-weight:650;display:flex;align-items:baseline;gap:8px;overflow-wrap:anywhere}
.panel h3{font-size:12px;font-weight:600;color:var(--dim);margin:12px 0 4px}
.panel .sub{color:var(--dim);font-size:12px}
.tag{font:500 11px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .off{color:var(--off)} .unknown{color:var(--unk)}
.un{color:var(--faint);font-weight:400}

/* the fleet's tally: one bar cut into the share of each state */
#tally{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:10px 0 8px;background:rgba(255,255,255,.07);gap:2px}
#tally i{display:block;height:100%;min-width:3px;background:currentColor;border-radius:2px}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;font:500 13px var(--mono)}
.counts div{display:flex;flex-direction:column}
.counts small{font:11px var(--sans);color:var(--dim)}
#groups{list-style:none;margin:2px -6px 0;padding:0 6px;max-height:36vh;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
#groups button{display:flex;width:100%;gap:8px;align-items:center;padding:3px 6px;margin:0 -6px;border-radius:6px}
#groups button:hover,#groups button.sel{background:rgba(140,170,255,.13)}
#groups i,.dot{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
#groups span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
#groups em{font:normal 12px var(--mono);color:var(--dim)}
#src{margin-top:10px;padding-top:8px;border-top:1px solid var(--edge);font-size:12px;color:var(--dim)}

/* the readout: rows of name and value; a metric also gets a bar, but only if it was measured */
.row{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:12px;color:var(--dim)}
.row b{font:400 12px/1.6 var(--mono);color:var(--ink);margin-left:auto;text-align:right;overflow-wrap:anywhere;min-width:0}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin:1px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#6aa8ff,#7ef0ff)}
.bar.w i{background:linear-gradient(90deg,#ffb04d,#ffd27a)} .bar.b i{background:linear-gradient(90deg,#ff4d6a,#ff8a70)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:8px;align-items:baseline;padding:1px 0}
.list .dot{position:relative;top:-1px;width:7px;height:7px}
.list span{flex:1;min-width:0;overflow-wrap:anywhere}
.list em{font:normal 12px var(--mono);color:var(--dim)}
.list button{color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.prob{color:var(--bad);margin-top:6px}
.prob.warn{color:var(--warn)}
#read .close{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:6px;color:var(--dim);text-align:center;font-size:16px;line-height:26px}
#read .close:hover{background:rgba(140,170,255,.13);color:var(--ink)}

/* labels: zero-size anchors moved by transform alone, never measured while drawing */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden}   /* only the few labels on show are promoted to their own layers: see setLabel */
.lb i{display:block;width:0;font-style:normal}
.lb span{position:absolute;left:0;top:0;transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:12.5px;line-height:1.25;pointer-events:auto;cursor:pointer;
  color:var(--ink);text-shadow:0 0 3px #000,0 0 6px #000;padding:1px 6px;border-radius:5px;background:rgba(3,5,16,.52)}   /* a dark backing, so a name stays readable over bright gas */
.lb small{display:block;font-size:11px;color:var(--dim)}
.lb.g span{font-size:14px;font-weight:650;letter-spacing:.02em}
.lb.sel span{color:var(--acc)}
.lb.bad span{color:var(--bad)} .lb.warn span{color:var(--warn)} .lb.off span{color:var(--off)}
.lb:focus-visible{outline:0}
.lb:focus-visible span{outline:2px solid var(--acc);outline-offset:1px}

#foot{position:fixed;left:20px;right:20px;bottom:12px;display:flex;gap:18px;align-items:center;font-size:12px;color:var(--dim);text-shadow:0 0 4px #000,0 0 2px #000;pointer-events:none}
#foot{flex-wrap:wrap;justify-content:flex-end;row-gap:6px;column-gap:12px}
#note{color:var(--warn);margin-right:auto}
#evt{color:var(--dim)}
#hint{transition:opacity .6s}
#foot>button{pointer-events:auto;padding:3px 10px;border:1px solid var(--edge);border-radius:999px;color:var(--ink);background:rgba(9,12,30,.55)}
#foot>button:hover{border-color:var(--acc)}
/* a row of choices, one of them pressed */
.seg{display:flex;align-items:center;gap:1px;pointer-events:auto;padding:2px 3px 2px 10px;border:1px solid var(--edge);border-radius:999px;background:rgba(9,12,30,.55);text-shadow:none}
.seg[hidden]{display:none}
.seg b{font-weight:500;color:var(--dim);margin-right:5px}
.seg button{padding:1px 8px;border-radius:999px;color:var(--dim)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:rgba(126,240,255,.17);color:var(--ink)}

@media (max-width:820px){
  #fleet,#hint,#detail,#events,#clouds,#scenery,#evt{display:none}
  #alert{top:auto;bottom:44px;max-width:calc(100vw - 24px)}
  #read{top:auto;bottom:44px;left:8px;right:8px;width:auto;max-height:46vh}
  .lb small{display:none}
}
@media (max-width:1800px){#hint{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="A sky of stars standing for the hosts in the data file. The same information is in the panels and labels."></canvas>
<div id="labels"></div>

<header id="brand" class="panel">
  <h1 id="title">Deepfield NOVA</h1>
  <p><span id="clock"></span><span id="sub">Waiting for data</span></p>
</header>

<div id="alert" role="status" aria-live="polite"><i></i><b id="alertWho"></b><span id="alertText"></span><em id="alertN"></em></div>

<aside id="fleet" class="panel" aria-label="Fleet summary">
  <h2><span id="total">0</span> <span class="sub" id="totalWord">nodes</span></h2>
  <div id="tally"></div>
  <div class="counts" id="counts"></div>
  <h3 id="groupsHead">Groups</h3>
  <ul id="groups"></ul>
  <p id="src"></p>
</aside>

<aside id="read" class="panel" aria-live="polite"></aside>

<footer id="foot">
  <span id="note"></span>
  <span id="evt"></span>
  <span id="hint">Drag to orbit · scroll to zoom · click a star</span>
  <div class="seg" id="motion" role="group" aria-label="Motion"><b>Motion</b><button type="button" data-v="off">Off</button><button type="button" data-v="slow">Slow</button><button type="button" data-v="normal">Normal</button><button type="button" data-v="fast">Fast</button></div>
  <div class="seg" id="detail" role="group" aria-label="Detail"><b>Detail</b><button type="button" data-v="auto">Auto</button><button type="button" data-v="low">Low</button><button type="button" data-v="medium">Medium</button><button type="button" data-v="high">High</button></div>
  <div class="seg" id="clouds" role="group" aria-label="Clouds"><b>Clouds</b><button type="button" data-v="dim">Dim</button><button type="button" data-v="normal">Normal</button><button type="button" data-v="vivid">Vivid</button></div>
  <div class="seg" id="scenery" role="group" aria-label="Scenery"><b>Scenery</b><button type="button" data-k="planet" title="Show or hide the ringed planet">Planet</button><button type="button" data-k="remnant" title="Show or hide the supernova remnant">Supernova</button></div>
  <div class="seg" id="events" role="group" aria-label="Sky events"><b>Sky events</b><button type="button" data-v="on">On</button><button type="button" data-v="off">Off</button></div>
  <button type="button" id="home">Whole sky</button>
  <button type="button" id="full">Full screen</button>
</footer>
<script>
'use strict';
/* ── CONFIG: the only part most people need to touch */
const CONFIG = {
  dataUrl: 'deepfield.json',  // the data file, relative to this page. Its shape is in SCHEMA.md
  pollMs: 10000,              // how often to fetch it
  title: '',                  // shown top left; leave empty to use the data file's own "title"
  demoWhenMissing: true,      // no data file on the first try: show a made-up estate, clearly marked, instead of an empty sky
  demo: 'estate',             // which made-up data that is: 'estate' (servers and agents) or 'notes' (a vault of linked notes). Adding ?demo=notes to the address picks the second
  layout: '',                 // how stars are placed in a galaxy. Empty: as the data file asks ("layout" in SCHEMA.md). 'arms': strung along spiral arms. 'web': gathered round the hubs they link to
  tour: true,                 // left alone for a while, the camera visits each galaxy in turn (good for a wall display)
  tourEverySec: 16,
  pauseOnBlur: false,         // true: stop drawing whenever the window loses focus, not only when the tab is hidden
  nebula: 1.0,                // sky brightness, 0 to 1.5
  gpuBudgetMs: 6,             // if a frame costs the GPU more than this, the scene drops to a lower resolution. 0 turns the guard off
  staleAfterSec: 120,         // data older than this (by its own "generated" time) is flagged as stale
  events: true,               // now and then something happens in the sky: a black hole, a supernova, a great comet. Scenery only, never data
  eventEverySec: [22, 48],    // the gap between sky events, picked at random between these two
  scenery: true,              // two things fixed far in the background: a ringed giant (after J1407b, the "Super Saturn") and a supernova remnant
};

/* ── LIMITS: how much the sky can hold. Every buffer is sized once from these, so raising one costs memory, not speed, until the data really is that big.
   What a large estate costs is drawing: each link is a ribbon and a few comets, each node a small quad and a label. As a guide, 512 nodes and 1,024 links
   are comfortable; past that, gather things up in the data instead (a node per rack or namespace, its members as moons). `groups` can go to about 80 before
   the shaders run out of room for their galaxy tables; `nodes` to 4,096 or more (they travel in a texture); `sprites` is all comets, moons and falling stars. */
const NAME = 'Deepfield NOVA';                 // what this page calls itself, wherever the data gives no title of its own
const LIMITS = { nodes: 512, groups: 32, links: 1024, sprites: 8000 };

/* ── what the viewer chooses with the controls at the bottom; kept in this browser only */
const PREF = { motion: 'normal', detail: 'auto', events: 'on', clouds: 'normal', planet: 'on', remnant: 'on', chosen: false };   // chosen: has the viewer picked a motion setting, or are we still following the system
const CLOUDS = { dim: 0.45, normal: 0.72, vivid: 1.1 };   // how bright the gas is, for each setting of the Clouds control (times CONFIG.nebula)
const DETAIL = {              // what each detail level costs: resolution, counts, frame rate. "auto" is high with a pixel ceiling, and the load guard free to lower the resolution
  // res: canvas pixels per screen pixel · px: the most pixels the canvas may ever have · bg: the sky and the clouds are drawn at this fraction of the canvas and enlarged (they are soft: nothing is lost)
  low:    { res: 0.6, px: 1.3e6, bg: 0.4, parts: 3000, stars: 1200, puffs: 10, comets: 0.5, labels: 14, minDt: 0.032, blur: false },
  medium: { res: 0.8, px: 2.6e6, bg: 0.5, parts: 6000, stars: 1800, puffs: 20, comets: 0.8, labels: 22, minDt: 0.0125, blur: true },
  high:   { res: 1.0, px: 8.3e6, bg: 0.6, parts: 9000, stars: 2400, puffs: 32, comets: 1.0, labels: 30, minDt: 0.0125, blur: true },
};
DETAIL.auto = Object.assign({}, DETAIL.high, { px: 4.2e6, bg: 0.5 });

const MAXN = LIMITS.nodes, MAXG = LIMITS.groups, MAXL = LIMITS.links, MAXS = LIMITS.sprites, STARS = 2400, GPARTS = 9000, MAXP = 32, MAXEV = 4, SEG = 24, CAP = 30, EXT = 6, BAKED = 8;   // BAKED: how many painting steps the start-up takes
const FOV = 42 * Math.PI / 180, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const STATES = ['ok', 'warn', 'bad', 'off', 'unknown'];
const WORD = { ok: 'ok', warn: 'needs a look', bad: 'failing', off: 'off', unknown: 'unknown' };
// What each state looks like as a star. Healthy stars are cool blue-white, so amber and red always mean something.
const STAR = { ok: [hex('#9ec9ff'), hex('#8fe9ff'), hex('#d9dcff'), hex('#a6b4ff')], warn: hex('#ffb347'), bad: hex('#ff4b57'), off: hex('#6b6f8a'), unknown: hex('#b9a6ff') };
const HUES = ['#7c8cff', '#5fb6ff', '#59d6d0', '#c77dff', '#ff7ac8', '#8fa2ff', '#4fd1ff', '#b48cff'].map(hex);   // galaxy tints; none amber or red
const LINKS = ['#8fb4ff', '#7ef0ff', '#c9a2ff', '#9dffd9', '#ffa8e0'].map(hex);

/* ── shaders
   Ten small programs, eight draw calls a frame (nine while a sky event is on), no post-processing. The nebula is painted once into a cube map
   at start-up; after that the sky costs two texture reads a pixel. Everything that moves is worked out on the
   GPU from the clock, so no buffer is rewritten to animate. Nothing is depth-tested: it is all light, and light adds. */
const HEAD = `#version 300 es
precision highp float;
uniform mat4 uVP; uniform mat3 uV2W; uniform vec2 uView, uT; uniform vec4 uCam, uX;
// uView viewport in device px · uT time as (whole thousands of seconds, the rest) · uCam px per world unit at depth 1, device pixel ratio, fog start, fog rate
// uX: 1 when motion is off, how alarmed the estate is (0 to 1), sky brightness, seconds since data last arrived
const float TAU = 6.2831853, PI = 3.14159265;
float turns(float r){ return fract(uT.x * r) + uT.y * r; }       // cycles made by a clock of r cycles a second; split time keeps it exact after days
float fog(float w){ return exp(-max(w - uCam.z, 0.0) * uCam.w); }
float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
float hash(float n){ n = fract(n * 0.1031); n *= n + 33.33; return fract(n * (n + n)); }
float line(float v, float w){ return 1.0 - smoothstep(w, w * 2.0, abs(v)); }
`;
const NODES = `
uniform sampler2D uNodes;                                         // every star's position and radius, one texel each: a texture, so their number has no small ceiling
vec4 node(float i){ return texelFetch(uNodes, ivec2(int(i), 0), 0); }
vec3 curve(vec4 A, vec4 B, float bend, float lane, float t){      // the path between two stars: a bowed arc from surface to surface
  vec3 d = B.xyz - A.xyz; float len = max(length(d), 1e-3);
  t = mix(A.w * 1.6 / len, 1.0 - B.w * 1.6 / len, t);
  vec3 C = (A.xyz + B.xyz) * 0.5 + vec3(0.0, len * bend, 0.0) + normalize(cross(d, vec3(0.0, 1.0, 0.0)) + 1e-4) * len * lane;
  float s = 1.0 - t; return s * s * A.xyz + 2.0 * s * t * C + t * t * B.xyz;
}`;
const GALAXY = `
uniform vec4 uGal[${MAXG}]; uniform vec3 uGU[${MAXG}], uGV[${MAXG}];   // every galaxy: centre, radius · two axes of its disc, already turned to where the spiral is now`;

// Run once per cube face at start-up (and once for the cloud sprite): layered noise, bent by more noise until it looks like gas.
const BAKE = [`#version 300 es
void main(){ gl_Position = vec4(vec2((gl_VertexID << 1) & 2, gl_VertexID & 2) * 2.0 - 1.0, 0.0, 1.0); }`, `#version 300 es
precision highp float;
uniform vec3 uR, uU, uF; uniform vec2 uSize; uniform float uSeed, uMode;
out vec4 o;
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1, 0, 0)), f.x), mix(h3(i + vec3(0, 1, 0)), h3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(h3(i + vec3(0, 0, 1)), h3(i + vec3(1, 0, 1)), f.x), mix(h3(i + vec3(0, 1, 1)), h3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p, int n){ float a = 0.5, s = 0.0; for (int i = 0; i < n; i++){ s += a * vn(p); p = p * 2.02 + vec3(13.1, 7.7, 3.3); a *= 0.5; } return s; }
void main(){
  vec2 uv = gl_FragCoord.xy / uSize * 2.0 - 1.0;
  if (uMode > 1.5){                                               // a supernova remnant: a ragged shell of hot gas round a cooler, hollow heart, shot through with filaments
    vec3 p = vec3(uv * 2.2, uSeed + 9.0); float w1 = fbm(p + 3.0, 5), w2 = fbm(p * 1.7 + 11.0, 5), r = length(uv) + (w1 - 0.5) * 0.36;
    float fil = 1.0 - abs(2.0 * fbm(vec3(uv * 5.0 + (w1 - 0.5) * 2.0, 3.0), 5) - 1.0), shell = exp(-(r - 0.62) * (r - 0.62) / 0.026); fil *= fil * fil;
    vec3 col = mix(vec3(1.0, 0.36, 0.08), vec3(1.0, 0.72, 0.25), w2) * shell * (0.3 + 1.5 * fil) * (0.55 + 0.9 * w2)       // the shell: orange into gold
      + vec3(0.9, 0.2, 0.16) * shell * smoothstep(0.6, 0.9, r) * 0.55                                                       // redder at its outer edge
      + vec3(0.26, 0.24, 0.8) * (1.0 - smoothstep(0.2, 0.72, r)) * (0.2 + 1.0 * fil * w1);                                          // the hollow: thin blue-violet
    o = vec4(col * (1.0 - smoothstep(0.6, 1.0, r)), 1.0); return;
  }
  if (uMode > 0.5){                                               // the flat cloud used for the puffs that drift among the galaxies
    vec3 p = vec3(uv * 2.0, uSeed); vec2 w = vec2(fbm(p + 5.2, 4), fbm(p + 9.1, 4)) - 0.5;
    o = vec4(smoothstep(0.28, 0.72, fbm(vec3(uv * 2.3 + w * 2.2, uSeed + 1.0), 5)), smoothstep(0.28, 0.72, fbm(vec3(uv * 3.1 - w * 1.8, uSeed + 4.0), 5)), 0.0, 1.0);
    return;
  }
  vec3 d = normalize(uF + uv.x * uR + uv.y * uU);                 // this texel's direction in the sky
  vec3 w = vec3(fbm(d * 1.4 + 3.1, 4), fbm(d * 1.4 + 7.7, 4), fbm(d * 1.4 + 11.3, 4)) - 0.5;
  float south = 0.1 * (1.0 - smoothstep(-0.55, 0.25, d.y));              // the camera mostly looks down into the scene, so the lower sky is where the gas is thickest

const SRC = {
  // The sky: the baked nebula read twice, the two reads drifting against each other so the gas seems to churn.
  sky: [`

out vec3 vD;

  // The sky and the clouds are soft, so they are drawn into small off-screen pictures and enlarged onto the canvas by this: a quarter of the pixel work for the same look.

  // Far stars: points at real distances, so they slide past each other as the camera moves. Each twinkles at its own rate.

in vec4 vC; out vec4 o;
void main(){ o = vC * (1.0 - smoothstep(0.1, 1.0, length(gl_PointCoord - 0.5) * 2.0)); }`],

  // Clouds that sit among the galaxies and slide against the sky as the camera moves. One baked texture, read twice at two turning angles.
  puff: [`
in vec2 aQ; in vec4 iP, iC, iR;                                   // corner · place, size · colour, strength · angle, turns a second, seed
out vec2 vUV; out vec4 vC, vRot;
void main(){
  vec4 c = uVP * vec4(iP.xyz, 1.0);
  float r = min(iP.w * uCam.x / c.w, 0.55 * uView.y);             // capped on screen: a cloud can never fill the view and be drawn over itself
  float a = iR.x + TAU * turns(iR.y), b = iR.z * 9.0 - a * 0.6;
  vRot = vec4(cos(a), sin(a), cos(b), sin(b)); vUV = aQ;

uniform sampler2D uTex;

  // A galaxy's glowing body: one flat quad lying in its disc, with the spiral drawn into it. The loose stars are a separate pass.
  disc: [GALAXY + `
in vec2 aQ; in vec4 iD, iC;                                       // corner · galaxy, arms, twist, alarm · colour, strength
out vec2 vUV; out float vFog; flat out vec4 vD, vC;

  int g = int(iD.x); vec4 G = uGal[g];

  col = mix(col, vec3(1.0, 0.3, 0.32), vD.w * (0.35 + 0.2 * sin(TAU * turns(0.8))) * exp(-r * 2.0));  // an alarmed galaxy reddens from the middle

  // The loose stars of every galaxy, in one call. Arm stars turn with the spiral; the rest go round at their own pace, the inner ones faster.
  gal: [GALAXY + `

  // A link: a ribbon with a bright core. Light moves along it the way the data does, and a front runs its length each time new data arrives.
  link: [NODES + `
in vec2 aS; in vec4 iE, iEc, iEx;                                 // t along, side · from, to, bend, lane · colour, live · flow rate, seed, how bright in a crowd, length

void main(){

  // A star for each node, and the soft core of each galaxy, in one capped quad apiece. Unlike everything before it, a star is not just light:
  // its body hides what is behind it and a soft shadow dims what is round it, so it stays readable however bright the gas.
  node: [`
in vec2 aQ; in vec4 iP, iC, iK, iM;                               // corner · place, radius · colour, brightness · state, focus, seed, seconds since it changed · kind, alarm
out vec2 vUV; out float vR, vFog, vExt; flat out vec4 vC, vK, vM;
void main(){
  vC = iC; vK = iK; vM = iM;
  vec4 c = uVP * vec4(iP.xyz, 1.0); bool core = iM.x > 4.5;
  vR = clamp(iP.w * uCam.x / c.w, 2.5 * uCam.y, (core ? 260.0 : ${CAP}.0) * uCam.y);   // capped on screen either way
  float ext = core ? 1.0 : iK.x > 0.5 || iK.y > 0.01 || iK.w < 2.5 ? ${EXT}.0 : 4.2;   // a quiet star needs less room than one with rings, a reticle or a shell going out

const float EXT = ${EXT}.0;
void main(){

  if (vM.x > 4.5){                                                // a galaxy's core: a soft bulge of old light, breathing; alarmed, it throbs. Light only
    col = vC.rgb * vC.a * (exp(-d * d * 9.0) + 0.3 * exp(-d * 3.4)) * (1.0 + 0.1 * sin(TAU * turns(0.07) + sd * 9.0) + vM.y * 0.4 * sin(TAU * turns(0.8)));

  if (st > 2.5){                                                  // off: a cold cinder with a thin ring. Unknown: the same, its ring broken and turning
    col = vC.rgb * (disc * (0.3 + 0.1 * sin(vUV.x * 6.0 + sd * 20.0)) + 0.55 * line(d - 1.7, px * 1.2) * (st > 3.5 ? step(0.5, fract(ang / TAU * 10.0 + turns(0.03))) : 0.6) + 0.1 * exp(-d * 1.5)) + edge * 0.55;

    float flick = 1.0 + (st > 1.5 ? 0.28 : 0.08) * sin(TAU * turns(st > 1.5 ? 1.7 : 0.31) + sd * 50.0);   // a failing star flickers hard

}`],

  // Scenery, never data. One quad apiece. Sky events come and go: 1 a black hole · 2 a supernova · 3 a pulsar · 4 jets from a galaxy's core · 5 a great comet.
  // Two things stay, fixed far behind everything: 6 a ringed giant · 7 a supernova remnant
  event: [GALAXY + `
in vec2 aQ; in vec4 iP, iA, iB, iC;                               // corner · place, size · kind, age from 0 to 1, seed · a second point, or (…, which galaxy) · colour, strength
out vec2 vUV; out float vPx, vHead; flat out vec4 vA, vC, vS1, vS2;   // vS1, vS2: whatever the far scenery needs that is the same for every pixel, worked out once here
void main(){
  vA = iA; vC = iC; vUV = aQ; vPx = 0.01; vHead = 1.0; vS1 = vS2 = vec4(0.0); float age = iA.y;
  if (iA.x > 4.5 && iA.x < 5.5){                                  // the great comet: one long quad from tail to head, crossing in front of everything

    float along = aQ.y * 0.5 + 0.5, w = 11.0 * uCam.y;

  }
  if (iA.x > 3.5 && iA.x < 4.5){                                  // jets: a tall quad standing on a galaxy's disc, turned to face the camera, growing out of the core
    int g = int(iB.w); vec4 G = uGal[g]; vec3 N = normalize(cross(uGU[g], uGV[g])), side = normalize(cross(N, uV2W[2]) + 1e-4);
    gl_Position = uVP * vec4(G.xyz + N * aQ.y * G.w * 2.4 * smoothstep(0.0, 0.18, age) + side * aQ.x * G.w * 0.5, 1.0); return;

  vUV = aQ * box; vPx = 1.0 / r; c.xy += aQ * box * r * 2.0 / uView * c.w; gl_Position = c;
  if (iA.x > 5.5) gl_Position.z = 0.0;                            // far scenery is never cut off by the far end of the view

    vS1 = vec4(1.0 + 0.1 * sin(TAU * turns(0.083)) + 0.035 * sin(TAU * turns(0.031) + 1.0), fract(turns(0.036)), 0.8 + 0.13 * sin(TAU * turns(0.37)) + 0.07 * sin(TAU * turns(0.83) + 2.0), fract(turns(0.11)));
    vS2 = vec4(0.92 + 0.08 * sin(TAU * turns(0.05)), 0.0, 0.0, 0.0);
  } else if (iA.x > 5.5){                                         // where the giant's three moons are, in planet radii across the quad: each goes round at the rate its distance sets
    vec3 ar = vec3(2.95, 4.3, 6.42), ph = TAU * (vec3(turns(0.098 / (ar.x * sqrt(ar.x))), turns(0.098 / (ar.y * sqrt(ar.y))), turns(0.098 / (ar.z * sqrt(ar.z)))) + vec3(hash(2.0), hash(9.7), hash(17.4)));
    vS1 = vec4(ar.x * cos(ph.x), ar.x * sin(ph.x) * 0.3, ar.y * cos(ph.y), ar.y * sin(ph.y) * 0.3); vS2 = vec4(ar.z * cos(ph.z), ar.z * sin(ph.z) * 0.3, 0.0, 0.0);

}`, `
uniform sampler2D uTexR;                                          // the remnant, painted once at start-up
in vec2 vUV; in float vPx, vHead; flat in vec4 vA, vC, vS1, vS2; out vec4 o;
float n1(float x){ float i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(hash(i), hash(i + 1.0), f); }

  // The tour: left alone for a while, the camera visits what is failing, then each galaxy, then the whole sky, and round again
  if (!CONFIG.tour || !running || drag || hover >= 0 || S[IDLE] < 20 || (!touring && (pin >= 0 || S[ZOOMED]))) return;
  if (++tourAt % CONFIG.tourEverySec !== 1) return;
  const stops = [[-1, -1]]; model.nodes.filter(n => n.status === 'bad').slice(0, 3).forEach(n => stops.push([n.i, -1])); if (nG > 1) model.groups.forEach((g, gi) => stops.push([-1, gi]));
  if (stops.length < 2) return;
  const s = stops[Math.floor(tourAt / CONFIG.tourEverySec) % stops.length]; touring = true;
  if (s[0] >= 0) setPin(s[0]); else if (s[1] >= 0) focusGalaxy(s[1]); else goHome();
}

/* ── size and visibility */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2) * scale;
  W = Math.max(1, canvas.clientWidth); H = Math.max(1, canvas.clientHeight);
  const over = W * H * DPR * DPR / D.px; if (over > 1) DPR /= Math.sqrt(over);   // a ceiling on pixels, whatever the screen: a 4K panel does not get four times the work of a 1080p one
  const w = Math.round(W * DPR), h = Math.round(H * DPR);
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  if (gl){ gl.viewport(0, 0, w, h); sizeBack(); }
  TX.length = TY.length = 0;                   // every label position this size can need, so the frame loop never builds a string
  for (let i = 0; i <= w + 1; i++) TX.push('translateX(' + (i / DPR).toFixed(2) + 'px)');
  for (let i = 0; i <= h + 1; i++) TY.push('translateY(' + (i / DPR).toFixed(2) + 'px)');
  LX.fill(-1); LY.fill(-1);
  const home = S[GRAD] === S[HOMER]; S[HOMER] = clamp(extent * (0.8 + Math.min(0.1, nG * 0.004)) / (Math.tan(FOV / 2) * Math.min(1, W / H * 0.72)), 7, 180); if (home) S[GRAD] = S[HOMER];
  once();
}
let sizeTimer = 0;
const resized = () => { clearTimeout(sizeTimer); sizeTimer = setTimeout(resize, 120); };
addEventListener('resize', resized);
if (window.ResizeObserver) new ResizeObserver(resized).observe(canvas);
document.addEventListener('visibilitychange', () => { if (document.hidden){ stop(); watch(false); } else { watch(true); start(); } });   // hidden: no frames, no fetches
if (CONFIG.pauseOnBlur){ addEventListener('blur', stop); addEventListener('focus', start); }
motionOff.addEventListener('change', () => { if (!PREF.chosen){ PREF.motion = motionOff.matches ? 'off' : 'normal'; showPrefs(); applyMotion(); } });   // follow the system until the viewer has chosen for themselves

/* ── the viewer's choices: motion, detail, sky events. Kept in this browser only; without storage they simply last until the page is closed */
function loadPrefs(){
  try { const p = JSON.parse(localStorage.getItem('deepfield.view') || '{}'); for (const k of ['motion', 'detail', 'events', 'clouds', 'planet', 'remnant']) if (typeof p[k] === 'string') PREF[k] = p[k]; PREF.chosen = p.chosen === true; } catch (e){}
  if (!Object.prototype.hasOwnProperty.call(CLOUDS, PREF.clouds)) PREF.clouds = 'normal';
  if (!['off', 'slow', 'normal', 'fast'].includes(PREF.motion)) PREF.motion = 'normal';
  if (PREF.detail !== 'auto' && !Object.prototype.hasOwnProperty.call(DETAIL, PREF.detail)) PREF.detail = 'auto';
  if (PREF.events !== 'off') PREF.events = 'on';
  if (PREF.planet !== 'off') PREF.planet = 'on'; if (PREF.remnant !== 'off') PREF.remnant = 'on';
  if (!PREF.chosen) PREF.motion = motionOff.matches ? 'off' : 'normal';   // nobody has chosen yet: a system that asks for reduced motion gets a still picture, and a note saying how to change that
}
function showPrefs(){
  for (const k of ['motion', 'detail', 'clouds', 'events']) for (const b of $(k).querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.v === PREF[k]);
  for (const b of $('scenery').querySelectorAll('button')) b.setAttribute('aria-pressed', PREF[b.dataset.k] === 'on');   // these two are switches: lit means shown
  $('scenery').hidden = !CONFIG.scenery;
}
function clearEvents(){ EVK.fill(0); EVS[0] = EVS[2] = -1e9; $('evt').textContent = ''; evWait = 6; }
function applyMotion(){
  still = PREF.motion === 'off'; speed = PREF.motion === 'slow' ? 0.4 : PREF.motion === 'fast' ? 2.2 : 1;
  if (still){ clearEvents(); stop(); } else start();
  say(); once();
}
function applyDetail(){
  D = DETAIL[PREF.detail] || DETAIL.auto; scale = PREF.detail === 'auto' ? autoScale : D.res;
  document.body.classList.toggle('lite', !D.blur || (PREF.detail === 'auto' && autoScale < 1));
  if (gl) sizeSky();
  fill(); resize(); say();
}
for (const k of ['motion', 'detail', 'clouds', 'events']) $(k).addEventListener('click', e => {
  const v = e.target.dataset ? e.target.dataset.v : null; if (!v) return;
  PREF[k] = v; if (k === 'motion') PREF.chosen = true;
  try { localStorage.setItem('deepfield.view', JSON.stringify(PREF)); } catch (err){}
  showPrefs(); touched();
  if (k === 'motion') applyMotion(); else if (k === 'detail') applyDetail(); else if (k === 'events'){ clearEvents(); once(); } else once();
});
$('scenery').addEventListener('click', e => {                     // the planet and the supernova each have a switch of their own
  const k = e.target.dataset ? e.target.dataset.k : null; if (!k) return;
  PREF[k] = PREF[k] === 'on' ? 'off' : 'on';
  try { localStorage.setItem('deepfield.view', JSON.stringify(PREF)); } catch (err){}
  showPrefs(); touched(); packScenery(); once();
});

/* ── far scenery: a ringed giant and a supernova remnant, fixed in space far behind everything, where the opening view has them in its background.
   Nothing to do with the data. The remnant is the one place warm colour appears that is not a warning: it is far off, it is huge, and it never pulses. */
function placeScenery(){
  if (!CONFIG.scenery || !gl){ nSC = 0; return; }
  const sp = Math.sin(PH0), f = [-sp * Math.sin(TH0), -Math.cos(PH0), -sp * Math.cos(TH0)], x = [Math.cos(TH0), 0, -Math.sin(TH0)], th = Math.tan(FOV / 2), asp = 1.6;   // the opening view's own axes: forward, right,
  const y = [f[2] * x[1] - f[1] * x[2], f[0] * x[2] - f[2] * x[0], f[1] * x[0] - f[0] * x[1]], cam = f.map(v => -v * S[HOMER]);                                       // and up; and where the camera stands
  const at = (d, sx, sy) => [0, 1, 2].map(k => cam[k] + (f[k] + (x[k] * sx * asp + y[k] * sy) * th) * d);   // a point that far off, at (sx, sy) across that view
  const seen = [];                              // where each galaxy falls in that view, and how wide
  for (let g = 0; g < nG; g++){ const v = [0, 1, 2].map(k => GALT[g * 4 + k] - cam[k]), d = v[0] * f[0] + v[1] * f[1] + v[2] * f[2]; if (d > 1) seen.push([(v[0] * x[0] + v[1] * x[1] + v[2] * x[2]) / (d * th * asp), (v[0] * y[0] + v[1] * y[1] + v[2] * y[2]) / (d * th), GALT[g * 4 + 3] / (d * th)]); }
  const clear = s => seen.reduce((m, g) => Math.min(m, Math.hypot((s[0] - g[0]) * asp, s[1] - g[1]) - g[2]), 9);
  const spots = [[-0.72, 0.4], [-0.8, -0.5], [0.8, -0.5], [0.02, -0.66], [0.12, 0.62], [-0.3, 0.7], [-0.86, -0.05]].sort((p, q) => clear(q) - clear(p));   // the corners and edges, clearest first
  const far = Math.max(190, S[HOMER] * 3), k = far / 190;        // always well behind the estate, however large it is, and the same size on screen
  const a = spots[0], b = spots.find(s => Math.hypot(s[0] - a[0], s[1] - a[1]) > 0.9) || spots[1], pa = at(far, a[0], a[1]), pb = at(far * 0.8, b[0], b[1]);
  scPlace = [pa[0], pa[1], pa[2], 38 * k, pb[0], pb[1], pb[2], 34 * k];   // kept, so switching one off and on again never moves the other
  packScenery();
}
let scPlace = null;
function packScenery(){                         // send whichever of the two the viewer has left switched on
  nSC = 0; if (!CONFIG.scenery || !gl || !scPlace) return;
  const p = scPlace;
  if (PREF.remnant === 'on') SCN.set([p[0], p[1], p[2], p[3], 7, 0, 0.4, 0, 0, 0, 0, 0, 1, 1, 1, 0.75], nSC++ * 16);
  if (PREF.planet === 'on') SCN.set([p[4], p[5], p[6], p[7], 6, 0, 0.3, 0, 0, 0, 0, 0, 1, 1, 1, 1], nSC++ * 16);
  if (nSC){ gl.bindBuffer(gl.ARRAY_BUFFER, BUF.scn); gl.bufferSubData(gl.ARRAY_BUFFER, 0, SCN); }
}

/* ── sky events: scenery that comes and goes. Placed where the camera is looking at the moment they begin. None of it is data, and none of it uses the colours that mean trouble. */
const EVENTS = ['', 'a black hole', 'a supernova', 'a pulsar', 'jets from a galaxy\'s core', 'a great comet', 'a meteor shower', 'a storm in the nebula'];
let evWait = 7, lastEv = 0, evtTimer = 0;
function spawn(kind){
  const t = S[CLOCK], r = S[RAD], th = Math.tan(FOV / 2), asp = W / H, rnd = Math.random;
  const fx = -VIEW[2], fy = -VIEW[6], fz = -VIEW[10], cx = S[CX] - fx * r, cy = S[CY] - fy * r, cz = S[CZ] - fz * r;   // which way the camera looks, and where it is
  const at = (depth, sx, sy) => [cx + (fx + (VIEW[0] * sx * asp + VIEW[1] * sy) * th) * depth, cy + (fy + (VIEW[4] * sx * asp + VIEW[5] * sy) * th) * depth, cz + (fz + (VIEW[8] * sx * asp + VIEW[9] * sy) * th) * depth];   // a point that far off, at (sx, sy) across the view, each from −1 to 1
  const spot = (wx, wy) => {                                      // somewhere in view that is not on top of a galaxy, so an event is never mistaken for one acting up
    for (let k = 0; k < 40; k++){
      const sx = (rnd() - 0.5) * wx, sy = (rnd() - 0.5) * wy, x = (sx * 0.5 + 0.5) * W, y = (0.5 - sy * 0.5) * H; let ok = true;
      for (let g = 0; g < nG; g++) if (GSCR[g * 4 + 3] > 0.2 && Math.hypot(x - GSCR[g * 4], y - GSCR[g * 4 + 1]) < GSCR[g * 4 + 2] * 0.9 + 110) ok = false;
      if (ok) return [sx, sy];
    }
    return null;
  };
  let life, row = null;
  if (kind === 6){ life = 6; EVS[0] = t; EVS[1] = life; UEV[2] = rnd() * 100; UEVP.set(at(r * 0.85, (rnd() - 0.5) * 0.9, 0.7 + rnd() * 0.35)); }   // a shower: it rains from one point above the galaxies
  else if (kind === 7){ life = 7; const p = at(1, (rnd() - 0.5) * 1.2, rnd() - 0.5); USTORM[0] = p[0] - cx; USTORM[1] = p[1] - cy; USTORM[2] = p[2] - cz; const l = Math.hypot(USTORM[0], USTORM[1], USTORM[2]); USTORM[0] /= l; USTORM[1] /= l; USTORM[2] /= l; EVS[2] = t; EVS[3] = life; }   // a storm: a patch of the sky's gas flashes
  else {
    const e = EVK.indexOf(0); if (e < 0) return false;
    if (kind < 4){                                                // a black hole, a supernova or a pulsar: each needs a clear patch of sky
      const s = spot(1.5, 1.3); if (!s) return false;
      if (kind === 1){ const p = at(r * (0.75 + 0.3 * rnd()), s[0], s[1]); life = 17; row = [p[0], p[1], p[2], clamp(r * 0.1, 1.4, 5), 1, 0, rnd(), 0, 0, 0, 0, 0, 0.68, 0.8, 1, 1]; }   // a black hole opens among the galaxies
      else if (kind === 2){ const d = r * 2 + 30, p = at(d, s[0], s[1]), c = rnd() < 0.5 ? [0.6, 0.85, 1] : [0.8, 0.7, 1]; life = 7; row = [p[0], p[1], p[2], d * 0.22, 2, 0, rnd(), 0, 0, 0, 0, 0, c[0], c[1], c[2], 1]; }   // a supernova, far behind everything
      else { const d = r * 1.5, p = at(d, s[0], s[1]); life = 14; row = [p[0], p[1], p[2], d * 0.19, 3, 0, rnd(), 0, 0, 0, 0, 0, 0.6, 0.9, 1, 1]; }   // a pulsar, out past the galaxies
    }
    else if (kind === 4){ if (!nG) return false; life = 10; row = [0, 0, 0, 1, 4, 0, rnd(), 0, 0, 0, 0, Math.floor(rnd() * nG), 0.78, 0.62, 1, 1]; }   // jets, from one galaxy's core
    else { const d = r * (0.5 + 0.25 * rnd()), s = rnd() < 0.5 ? -1 : 1, a = at(d, -1.3 * s, 0.25 + 0.6 * rnd()), b = at(d * 1.15, 1.3 * s, -0.75 + 0.6 * rnd()); life = 3.6; row = [a[0], a[1], a[2], d * 0.3, 5, 0, rnd(), 0, b[0], b[1], b[2], 0, 0.45, 0.85, 1, 1]; }   // a great comet, right across the view
    EV.set(row, e * 16); EVT[e * 2] = t; EVT[e * 2 + 1] = life; EVK[e] = kind;
  }
  $('evt').textContent = 'Sky event: ' + EVENTS[kind]; clearTimeout(evtTimer); evtTimer = setTimeout(() => { $('evt').textContent = ''; }, life * 1000 / speed + 400);
  return true;
}

/* ── boot: the sky is drawn at once; the stars arrive with the first read of the data file */
loadPrefs(); showPrefs();
try { if (!initGL()) gl = null; } catch (e){ console.error(e); gl = null; }
if (!gl) g2 = canvas.getContext('2d');
placeScenery(); applyDetail(); applyMotion(); header(); tick(); setInterval(tick, 1000);
if (!document.hidden) watch(true);
start(); once();
</script>
</body>
